<!doctype html>
<meta charset="utf-8">
<title>SkyPilot crop review</title>
<style>
  :root {
    --bg:#14161a; --panel:#1c1f26; --line:#2c313b; --fg:#e6e9ef; --dim:#8b93a3;
    /* one per class in configs/vehicle_7class.yaml, in schema order */
    --c0:#e0b341; --c1:#5b6472; --c2:#c46ad0; --c3:#7c8ff0; --c4:#4c9be8;
    --c5:#4fbf8b; --c6:#d9724a;
    --sel:#f26d5b;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:13px/1.45 ui-sans-serif,system-ui,Segoe UI,sans-serif; }

  header { position:sticky; top:0; z-index:5; background:var(--panel);
           border-bottom:1px solid var(--line); padding:10px 16px;
           display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:14px; margin:0; font-weight:600; letter-spacing:.02em; }
  .prior-tag { font-weight:600; }
  .spacer { flex:1; }
  .bar { width:180px; height:6px; background:var(--line); border-radius:3px;
         overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--c5); width:0; }
  .dim { color:var(--dim); }

  .keys { display:flex; gap:6px; flex-wrap:wrap; }
  .keys button { background:var(--line); color:var(--fg); border:1px solid #3a4150;
                 border-radius:5px; padding:3px 9px; font-size:12px; cursor:pointer; }
  .keys button:hover { border-color:var(--dim); }
  .keys b { font-family:ui-monospace,Consolas,monospace; color:var(--dim);
            margin-right:5px; }

  main { padding:14px 16px 90px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr));
          gap:8px; }

  .tile { position:relative; background:#0e1013; border:2px solid transparent;
          border-radius:6px; overflow:hidden; cursor:pointer; aspect-ratio:1;
          display:flex; align-items:center; justify-content:center; }
  .tile img { width:100%; height:100%; object-fit:contain; image-rendering:auto; }
  .tile.sel { border-color:var(--sel); box-shadow:0 0 0 2px rgba(242,109,91,.35); }
  .tile .tag { position:absolute; left:0; bottom:0; right:0; font-size:10px;
               padding:1px 4px; background:rgba(0,0,0,.72); letter-spacing:.03em;
               display:flex; justify-content:space-between; }
  .tile .px { color:var(--dim); }
  .tile.undecided .tag { opacity:.55; }
  .tile .ctx { position:absolute; top:2px; right:2px; font-size:10px;
               background:rgba(0,0,0,.6); border-radius:3px; padding:0 4px;
               opacity:0; }
  .tile:hover .ctx { opacity:1; }

  .c0 { border-left:4px solid var(--c0); } .c1 { border-left:4px solid var(--c1); }
  .c2 { border-left:4px solid var(--c2); } .c3 { border-left:4px solid var(--c3); }
  .c4 { border-left:4px solid var(--c4); } .c5 { border-left:4px solid var(--c5); }
  .c6 { border-left:4px solid var(--c6); }

  footer { position:fixed; bottom:0; left:0; right:0; background:var(--panel);
           border-top:1px solid var(--line); padding:9px 16px; display:flex;
           gap:14px; align-items:center; font-size:12px; }
  footer button { background:var(--line); color:var(--fg); border:1px solid #3a4150;
                  border-radius:5px; padding:4px 12px; cursor:pointer; }

  #modal { position:fixed; inset:0; background:rgba(8,9,12,.9); display:none;
           align-items:center; justify-content:center; z-index:20; }
  #modal.on { display:flex; }
  #modal .box { text-align:center; }
  #modal canvas { max-width:88vw; max-height:78vh; border:1px solid var(--line);
                  border-radius:6px; image-rendering:pixelated; }
  #modal p { color:var(--dim); margin:8px 0 0; font-size:12px; }
</style>

<header>
  <h1>Crop review</h1>
  <span>page <b id="pg">1</b>/<b id="pgn">1</b> &middot;
        prior <span class="prior-tag" id="prior">-</span></span>
  <div class="keys" id="keys"></div>
  <span class="spacer"></span>
  <div class="bar"><i id="fill"></i></div>
  <span class="dim" id="count">0 / 0</span>
</header>

<main><div class="grid" id="grid"></div></main>

<footer>
  <button id="prev">&larr; prev</button>
  <button id="next">next &rarr;</button>
  <button id="accept">Space &mdash; accept page as prior</button>
  <button id="undo">u &mdash; undo</button>
  <span class="dim" id="hint">click tiles to select, then 1-7 &middot;
        shift-click for a range &middot; click a tile's <b>&#9974;</b> for context</span>
  <span class="spacer"></span>
  <span class="dim" id="saved">saved</span>
</footer>

<div id="modal"><div class="box">
  <canvas id="cv"></canvas>
  <p id="cap"></p>
</div></div>

<script>
let M = null;              // manifest
let labels = {};           // crop_id -> class_id (server truth)
let page = 0, pages = 1;
let sel = new Set();       // selected crop ids on this page
let lastClick = null;
let undoStack = [];        // batch sizes, for undo

const $ = id => document.getElementById(id);
const byPage = p => M.crops.filter(c => c.page === p);

async function boot() {
  M = await (await fetch('/api/manifest')).json();
  labels = M.labels || {};
  pages = Math.max(...M.crops.map(c => c.page)) + 1;
  $('pgn').textContent = pages;

  $('keys').innerHTML = M.classes
    .map((n, i) => `<button data-k="${i}"><b>${i + 1}</b>${n}</button>`).join('');
  $('keys').onclick = e => {
    const b = e.target.closest('button');
    if (b) assign(+b.dataset.k);
  };

  $('prev').onclick = () => go(page - 1);
  $('next').onclick = () => go(page + 1);
  $('accept').onclick = acceptPage;
  $('undo').onclick = undo;
  $('modal').onclick = () => $('modal').classList.remove('on');

  // resume where the last session stopped: first page with anything undecided
  const first = M.crops.find(c => !(c.id in labels));
  go(first ? first.page : 0);
  render();
}

function go(p) {
  page = Math.min(Math.max(p, 0), pages - 1);
  sel.clear(); lastClick = null;
  render();
  scrollTo(0, 0);
}

function render() {
  const crops = byPage(page);
  $('pg').textContent = page + 1;
  $('prior').textContent = crops.length ? M.classes[crops[0].prior] : '-';
  $('prior').style.color = crops.length
    ? getComputedStyle(document.body).getPropertyValue('--c' + crops[0].prior) : '';

  $('grid').innerHTML = crops.map(c => {
    const has = c.id in labels;
    const cls = has ? labels[c.id] : c.prior;
    return `<div class="tile c${cls} ${sel.has(c.id) ? 'sel' : ''}
                 ${has ? '' : 'undecided'}" data-id="${c.id}">
      <img src="/crop/${encodeURIComponent(c.file)}" loading="lazy" alt="">
      <span class="ctx" data-ctx="${c.id}">&#9974;</span>
      <span class="tag"><span>${M.classes[cls]}</span>
                        <span class="px">${Math.round(c.size_px)}</span></span>
    </div>`;
  }).join('');

  $('grid').querySelectorAll('.tile').forEach(t => {
    t.onclick = e => {
      if (e.target.dataset.ctx) return context(e.target.dataset.ctx);
      click(t.dataset.id, e.shiftKey);
    };
  });
  progress();
}

function click(id, range) {
  const ids = byPage(page).map(c => c.id);
  if (range && lastClick !== null) {
    const [a, b] = [ids.indexOf(lastClick), ids.indexOf(id)].sort((x, y) => x - y);
    for (let i = a; i <= b; i++) sel.add(ids[i]);
  } else {
    sel.has(id) ? sel.delete(id) : sel.add(id);
    lastClick = id;
  }
  render();
}

async function post(url, body) {
  $('saved').textContent = 'saving...';
  const r = await (await fetch(url, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  })).json();
  $('saved').textContent = 'saved';
  return r;
}

async function assign(k) {
  if (!sel.size || k >= M.classes.length) return;
  const items = [...sel].map(id => ({ id, class_id: k }));
  items.forEach(i => labels[i.id] = k);
  undoStack.push(items.length);
  sel.clear(); lastClick = null;
  render();
  await post('/api/decide', { items });
}

async function acceptPage() {
  // The cheapest action must be the CONSERVATIVE one. Accepting a page stamps
  // each undecided crop with its prior. 'Vehicle' is the umbrella covering every
  // type, so leaving a crop there is true-but-unspecific, whereas a guessed SUV
  // is a real error. Any UI where guessing is easier than deferring gets guesses.
  const items = byPage(page).filter(c => !(c.id in labels))
                            .map(c => ({ id: c.id, class_id: c.prior }));
  if (items.length) {
    items.forEach(i => labels[i.id] = i.class_id);
    undoStack.push(items.length);
    await post('/api/decide', { items });
  }
  go(page + 1);
}

async function undo() {
  const n = undoStack.pop();
  if (!n) return;
  const r = await post('/api/undo', { count: n });
  labels = r.labels;
  render();
}

function progress() {
  const done = Object.keys(labels).length, all = M.crops.length;
  $('count').textContent = `${done} / ${all}`;
  $('fill').style.width = (done / all * 100) + '%';
}

function context(id) {
  // Full 416 frame with this box highlighted, for the ~10% of crops the tile
  // alone cannot settle.
  const c = M.crops.find(x => x.id === id);
  const img = new Image();
  img.onload = () => {
    const S = 3, cv = $('cv');
    cv.width = img.width * S; cv.height = img.height * S;
    const g = cv.getContext('2d');
    g.imageSmoothingEnabled = false;
    g.drawImage(img, 0, 0, cv.width, cv.height);
    const [x1, y1, x2, y2] = c.box_norm;
    g.strokeStyle = '#f26d5b'; g.lineWidth = 3;
    g.strokeRect(x1 * cv.width, y1 * cv.height,
                 (x2 - x1) * cv.width, (y2 - y1) * cv.height);
    $('cap').textContent =
      `${c.image}  |  box ${c.box_index}  |  ${Math.round(c.size_px)}px  |  `
      + `current: ${M.classes[c.id in labels ? labels[c.id] : c.prior]}`;
    $('modal').classList.add('on');
  };
  img.src = `/frame/${c.split}/${encodeURIComponent(c.image)}`;
}

addEventListener('keydown', e => {
  if (e.key === 'Escape') return $('modal').classList.remove('on');
  if ($('modal').classList.contains('on')) return;
  if (e.key >= '1' && e.key <= '9') { e.preventDefault(); assign(+e.key - 1); }
  else if (e.key === ' ') { e.preventDefault(); acceptPage(); }
  else if (e.key === 'u') undo();
  else if (e.key === 'ArrowRight') go(page + 1);
  else if (e.key === 'ArrowLeft') go(page - 1);
  else if (e.key === 'a' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    byPage(page).forEach(c => sel.add(c.id));
    render();
  }
});

boot();
</script>
